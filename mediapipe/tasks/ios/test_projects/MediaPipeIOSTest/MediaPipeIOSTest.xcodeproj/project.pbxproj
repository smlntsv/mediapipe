			name = "Copy MediaPipe Models";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copies the shared test models (.task files + converted Core ML models)\n# from the mediapipe repo into the app bundle. The .mlmodelc bundles must sit\n# FLAT next to the .task files: the Core ML delegate's default model cache\n# dir is the model asset's directory.\nset -e\nMODELS_SRC=\"${SRCROOT}/../../../macos/test_projects/shared/models\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nif [ ! -d \"${MODELS_SRC}\" ]; then\n  echo \"error: shared models not found at ${MODELS_SRC}\" >&2\n  exit 1\nfi\ncp -f \"${MODELS_SRC}\"/*.task \"${DST}/\"\nfor M in \"${MODELS_SRC}\"/coreml_models/*.mlmodelc; do\n  cp -Rf \"$M\" \"${DST}/\"\ndone\n";
			showEnvVarsInLog = 0;
		};
