syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

message HandRectsKeepAliveCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional HandRectsKeepAliveCalculatorOptions ext = 462713203;
  }

  // Maximum number of consecutive frames a vanished hand's rect is re-injected
  // into the tracking loop before the track is dropped. 0 disables holding
  // (pass-through).
  optional int32 max_miss_frames = 1 [default = 0];

  // Minimum IoU between a held rect and an incoming rect for the held hand to
  // be considered recovered (or already covered) by that incoming rect.
  optional float min_similarity_threshold = 2 [default = 0.5];
}
